<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Main Content Container -->
    <div class="flex-grow flex flex-col items-center justify-center p-4">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-blue-500 tracking-wider">VibeLink</h1>
            <p class="text-xs text-gray-400">Talk to strangers worldwide instantly</p>
        </header>

        <!-- VIEW 1: Landing / Filter & Start Screen -->
        <div id="homeView" class="w-full max-w-md p-6 bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl text-center">
            <h3 class="text-sm font-semibold mb-4 text-gray-300 flex items-center justify-between">
                <span>Match Filters</span>
                <span id="filterStatus" class="text-xs bg-blue-600 px-2 py-0.5 rounded text-white font-normal">Ready</span>
            </h3>
            
            <div class="grid grid-cols-2 gap-3 mb-6 text-left">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Looking for:</label>
                    <select id="genderFilter" class="w-full bg-gray-800 border border-gray-700 text-sm rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                        <option value="any">Any Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Country:</label>
                    <select id="countryFilter" class="w-full bg-gray-800 border border-gray-700 text-sm rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
                        <option value="any">Worldwide</option>
                        <option value="us">United States</option>
                        <option value="uk">United Kingdom</option>
                        <option value="bd">Bangladesh</option>
                        <option value="in">India</option>
                        <option value="ca">Canada</option>
                    </select>
                </div>
            </div>

            <button onclick="startChat()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl text-base font-bold transition text-white shadow-lg shadow-blue-600/30">
                Start Random Chat
            </button>
        </div>

        <!-- VIEW 2: Active Chat / Video Interface (Initially Hidden) -->
        <div id="chatView" class="hidden w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Video Box -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 flex flex-col justify-between h-[400px]">
                <div class="flex justify-between items-center text-xs text-gray-400">
                    <span class="bg-red-500
